  <g transform="translate(0, -1.3)">
    <svg xmlns="http://www.w3.org/2000/svg" width="46.64" height="46.64" viewBox="0 0 46.64 46.64" role="img" aria-label="Stub">
  <defs>
    <linearGradient id="s458v9a1f" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="48%" stop-color="#5B4FE8"/>
      <stop offset="100%" stop-color="#4A3DC4"/>
    </linearGradient>
    <linearGradient id="s458v9a1s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.40"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- The tile is shaded rather than flat. A flat white square reads as printed on the
         background; a face falling off very slightly towards the bottom reads as a
         physical object catching light from above, which is what every platform's own
         icons do. The range is deliberately narrow — a strong gradient here competes with
         the mark and looks like a button. -->
    <linearGradient id="s458v9a1t" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f6f6f6"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>

    <!-- A hairline inside the edge. It separates the tile from a background of a similar
         colour — a white tile on a white page otherwise has no boundary at all — and
         gives the top edge the thin bright line a lit surface has. -->
    <linearGradient id="s458v9a1e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#d6d6d6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bdbdbd" stop-opacity="0.42"/>
    </linearGradient>

    <clipPath id="s458v9a1c"><path d="M 6.80 0 L 16.07 0 A 2.12 2.12 0 0 0 20.31 0 L 29.58 0 A 6.80 6.80 0 0 1 36.38 6.80 L 36.38 11.04 A 3.82 4.08 0 0 0 36.38 19.20 L 36.38 23.44 A 6.80 6.80 0 0 1 29.58 30.24 L 20.31 30.24 A 2.12 2.12 0 0 0 16.07 30.24 L 6.80 30.24 A 6.80 6.80 0 0 1 0 23.44 L 0 19.20 A 3.82 4.08 0 0 0 0 11.04 L 0 6.80 A 6.80 6.80 0 0 1 6.80 0 Z" transform="translate(5.13 8.20)"/></clipPath>
    <!-- The perforation is cut out of the mark rather than painted over it, so the tile
         shows through. Painted white it was invisible the moment the tile turned white,
         and the mark lost the one detail that says "ticket". -->
    <mask id="s458v9a1m">
      <path d="M 6.80 0 L 16.07 0 A 2.12 2.12 0 0 0 20.31 0 L 29.58 0 A 6.80 6.80 0 0 1 36.38 6.80 L 36.38 11.04 A 3.82 4.08 0 0 0 36.38 19.20 L 36.38 23.44 A 6.80 6.80 0 0 1 29.58 30.24 L 20.31 30.24 A 2.12 2.12 0 0 0 16.07 30.24 L 6.80 30.24 A 6.80 6.80 0 0 1 0 23.44 L 0 19.20 A 3.82 4.08 0 0 0 0 11.04 L 0 6.80 A 6.80 6.80 0 0 1 6.80 0 Z" transform="translate(5.13 8.20)" fill="#fff"/>
      <g transform="translate(5.13 8.20)"><rect x="17.06" y="3.63"
      width="2.27" height="3.93" rx="1.13" fill="#000"/><rect x="17.06" y="9.98"
      width="2.27" height="3.93" rx="1.13" fill="#000"/><rect x="17.06" y="16.33"
      width="2.27" height="3.93" rx="1.13" fill="#000"/><rect x="17.06" y="22.68"
      width="2.27" height="3.93" rx="1.13" fill="#000"/></g>
    </mask>
  </defs>
